name: Refresh macro calendar and signals

on:
  schedule:
    - cron: "15 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install free data client
        run: python3 -m pip install -r requirements.txt

      - name: Refresh release calendar
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 scripts/update_calendar.py

      - name: Refresh historical gold reactions
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 scripts/build_historical.py

      - name: Build Phase 3 signals
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 scripts/build_signals.py

      - name: Capture live locked signals
        run: python3 scripts/capture_locked_signals.py

      - name: Grade completed locked signals
        run: python3 scripts/update_track_record.py

      - name: Build chained cases
        run: python3 scripts/build_chains.py

      - name: Commit changed generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar.json data/status.json data/historical_reactions.json data/signals.json data/locked_signals.json data/track_record.json data/chained_cases.json
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
          else
            git commit -m "chore: refresh macro calendar and signals"
            git push
          fi
